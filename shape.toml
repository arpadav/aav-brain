# the shape policy: the NUMBERS behind P27 and P28, and the budget that arms a
# phase gate. authored data, like flow.toml and prune.toml - brainlib reads it,
# no tool hardcodes a number.
#
# these exist because "a file that is too long" is an ADJECTIVE, and a worker
# resolves an adjective against its own priors (P40). the measurement that
# forced them is stated once, on the card itself:
# brain/principles/principle-27-organization-reorg.md, under `## the measurement`.
# it is not restated here, and it is not restated in the tool - one anecdote
# retold in nine places drifts in nine directions.
#
# a crossing is a FINDING, not a verdict. it says a human or a reviewer should
# look, the same way prune.toml's window says an entry is old enough to read.
# a 2400-line file that is one coherent table of sourced constants is fine, and
# nothing here may split it.

[tree]
# past this, a source file is a candidate for flat->tree (P27). the card's own
# prose has named 2000 since it was written; it had simply never been measured.
file_lines = 2000

# a folder holding more than this many direct source files is a candidate for
# the same split in the other axis - the "folder has too many flat files" half
# of P27, which had never had a number at all.
folder_files = 12

# the OTHER direction, which P27 insists on and nothing had ever reported: a
# folder at or under both of these is a candidate for tree->flat, because
# structure for its own sake is debt (P14). deliberately conservative - a
# two-file 120-line folder is a real smell, a three-file one usually is not.
collapse_files = 2
collapse_lines = 120

# folders whose fan-out is the DELIBERATE form, exempt from folder_files. a
# zettelkasten is one file per card on purpose and its INDEX is maintained; a
# threshold that reports it is measuring the convention, not a defect. keep this
# list short - it is the one place a real crossing can be silenced, and every
# entry needs a reason that is about the FORM, never about the work of fixing it.
exempt = ["/brain/principles/", "/brain/intents/"]

# a TYPE name (struct/enum/trait/class/interface/union/record) declared in this
# many files or more is a DRY candidate (P28, P31). two is the real threshold: a
# datatype defined twice is the exact thing P31 forbids. it is reported, never
# auto-merged - a `Config` in two unrelated crates is not a violation, and a
# per-module `Error` enum is idiomatic rust, not duplication.
duplicate_type_files = 2

[budget]
# SECONDARY: `brain-gate.py phase` decides whether a phase buys the gate; this
# budget only takes the `under_budget` exit on a final phase brain-gate.py
# deferred. plans/open-items/G01-two-gate-arming-checks.md decides whether it
# stays.
#
# the phase gate is ARMED when a phase's accumulated change crosses either of
# these. under both, the phase still ends with VERIFY and STYLE - it just does
# not buy a cold multi-lens review.
#
# this is the milestone half of the gate: PHASEGATE used to fire once per phase
# whether the phase was thousands of new lines or two lines of formatter
# appeasement, so the same machinery reviewed both. arming decouples the cold
# review from the phase COUNT and attaches it to the phase SIZE.
#
# lines are counted as CHURN (added + removed) over source files only, with
# untracked new files included: a phase that deletes 5000 lines changed a great
# deal, and a regenerated graph changed nothing worth reviewing.
#
# prose does NOT count toward these two - see `prose` under [scan]. everything
# else in this file measures a markdown file exactly like a rust one; arming is
# the one place that would be wrong.
changed_files = 4
changed_lines = 400

[scan]
# the suffixes measured. a file whose suffix is absent here is invisible to
# every measurement, so an omission reads as cleanliness - `.md` is here
# because this repo IS a markdown corpus and leaving it out made the brain's
# own "0 crossings" a scope artifact rather than a fact. prose suffixes are
# measured for LENGTH only; the tool never reads a type declaration out of one.
suffixes = [
    ".rs", ".py", ".ts", ".tsx", ".js", ".jsx", ".svelte", ".go", ".c", ".h",
    ".cc", ".cpp", ".hpp", ".cu", ".cuh", ".java", ".kt", ".swift", ".rb",
    ".sh", ".bash", ".nix", ".zig", ".lua", ".md",
]

# the suffixes above whose contents are PROSE. they are measured for length and
# for folder fan-out like anything else, and they are never scanned for a type
# declaration - but their churn may not ARM a cold review, here or in
# brain-gate.py, which reads this same list. a handoff document
# rewritten in place is hundreds of changed lines that no code lens reads, and
# arming on it spends five reviewers on a diff with no code in it.
prose = [".md", ".markdown", ".rst", ".txt"]

# path fragments excluded from every measurement. each one is a tree this repo
# does not AUTHOR: vendored code is not his to fix, and the rest are build or
# install output directories that are gitignored wherever they appear. a
# generated file that is TRACKED is deliberately not excluded - if it is
# committed it is part of the repo's shape, and brain-decisions.py asks why it
# is committed at all.
excluded = [
    "/vendor/", "/node_modules/", "/target/", "/dist/", "/build/", "/third_party/",
]

[decisions]
# brain-decisions.py questions past decisions instead of confirming them.
#
# a unit (skill, agent, flow state, principle card) named from more than this
# many files outside itself is reported: every one of those files was a past
# decision to extend the unit in place rather than to question it.
reach_files = 15

# a tracked file a builder writes, or that .gitignore disowns, is a finding
# unless its path is keyed here with WHY it is committed. a reason is about what
# breaks without the committed copy, never about the work of untracking it.
[decisions.tracked]
"docs/DEV_FLOWCHART.md" = "he reads the flowchart on GitHub and in his editor; without the committed copy there is nothing to view"
