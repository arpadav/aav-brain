# checks a change to the brain must pass before it counts as verified, keyed
# by the paths they cover. b-verify reads it; `*` crosses directories
[[check]]
name = "open-items tests"
when = ["skills/brain-open-items/*", "bin/brainlib/*", "bin/b-find.py", "bin/check/b-lint.py",
        "ruff.toml", "mypy.ini", "pyrightconfig.json", "ty.toml"]
run = "python3 skills/brain-open-items/test_brain_open_items.py"
