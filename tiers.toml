# the tier policy: which cards load on every recall, which are scored, and which
# clear a lower bar. authored data, like flow.toml, prune.toml and shape.toml -
# brain-cards.py checks the cards against it, and no tier is decided by taste.
#
# this file exists because the first version of the tier work did not have it.
# 51 frontmatter values were set from a measurement whose rule, thresholds and
# input tables lived only in a scratch directory, so the assignments were
# reproducible that afternoon and unreproducible as a property of the repo. a
# number the repo depends on belongs in the repo, with what produced it.

[rule]
# the whole assignment, as three lines. it reproduces all 51 values below.
#   breadth >= constitution_breadth                  -> constitution
#   breadth <= narrow_breadth AND served < narrow_served -> narrow
#   otherwise                                        -> conditional
constitution_breadth = 0.20
narrow_breadth = 0.02
narrow_served = 0.05

[measurement]
# BREADTH: the share of a 50-prompt labelled sample where the card was judged
# relevant (>= 5 on a ten-criterion weighted rubric, scored by one agent per
# card, each judging its card in isolation). the prompts were drawn from the
# real corpus and stratified by size of ask, not by vocabulary.
#
# SERVED: the share of 1374 real prompts where the card reached the top 8 under
# the scorer AS IT WAS BEFORE this work - the degree-normalised spread, the
# constitution tier and the share-based floor all postdate it. it is a record of
# the problem, not of current behaviour, and re-measuring it against today's
# recall would compare the fix to itself.
#
# the two DISAGREEING is the point. principle-11 was judged relevant on 28% of
# the sample and served on 1% of real recalls; that gap is what a constitution
# tier is for. where they agree, the scorer was already doing its job.
sample_prompts = 50
corpus_prompts = 1374
rubric_relevant_at = 5.0
measured_on = "2026-09-05"

# CAVEATS, because a number without them is a claim rather than a measurement:
# - the rubric agents marked 5.4 cards as GOVERNING each prompt on average, and
#   only one rule can decide an action, so breadth is inflated at the top end.
# - `narrow` is defined by LOW measured breadth, not by measured precision. ten
#   of the fourteen were judged relevant on one prompt of fifty and four on
#   none. the lower floor is a bet that a rare card is specific rather than
#   dead, and it is a bet, not a finding.
# - a 50-prompt sample resolves breadth to 2% steps. a card at 0.20 and one at
#   0.18 are one prompt apart, and the constitution boundary sits there.
# - re-derive after the corpus grows materially. do not hand-edit a tier here or
#   in a card without re-running the measurement; brain-cards.py compares the
#   two and will report the drift either way.

