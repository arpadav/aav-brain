; mypy config for the brain's python tooling (bin/).
;
; pinned like ruff.toml, ty.toml and pyrightconfig.json. `strict` is mypy's own
; bundle (it already carries disallow_any_generics, so `nodes: dict` fails here
; too); everything under it is a knob strict does NOT set, added deliberately.
;
; the Any knobs are split deliberately. every tool here reads json - graph.json,
; flow.json, the jsonl corpora - and json.loads is Any by definition, so a blanket
; ban means either `object` plus a cast on every access or a TypedDict per
; artifact shape. that is a schema layer, not a strictness setting, so:
;   ON  - disallow_any_generics (via strict): a bare `dict` is the actual defect
;   ON  - disallow_any_unimported: an untyped dependency must not leak in silently
;   OFF - disallow_any_explicit / _decorated / _expr: `Any` is allowed to be
;         WRITTEN at the json boundary, where it is the honest type

[mypy]
; the floor every checker holds, matching the `# requires-python` header the
; scripts carry for `uv run` and the interpreter the skills invoke them with
python_version = 3.12
files = bin
strict = True

disallow_any_unimported = True
warn_unreachable = True
strict_bytes = True
extra_checks = True
; explicit-override is deliberately absent: @override arrives in typing at 3.12
; and these scripts carry `dependencies = []`, so requiring it would mean adding
; typing_extensions to stdlib-only tools
enable_error_code = redundant-expr,possibly-undefined,truthy-bool,ignore-without-code,unused-awaitable

; brainlib is imported by sibling scripts via a sys.path insert, which mypy
; cannot follow; the scripts are not a package
mypy_path = bin
explicit_package_bases = True
